; Remplace entierement le www.conf par defaut de l'image officielle
; wordpress:*-fpm (monte par-dessus le fichier original au meme chemin,
; voir docker-compose.yml).
;
; user/group/listen reproduisent les valeurs par defaut de l'image (nginx
; est configure sur fastcgi_pass wordpress:9000, voir
; docker/nginx/default.conf) -- seuls les reglages pm.* changent, pour
; augmenter le nombre de workers PHP-FPM concurrents (5 par defaut, sature
; avec le polling ALT/SEO en tache de fond).
[www]
user = www-data
group = www-data
listen = 9000
listen.owner = www-data
listen.group = www-data

pm = dynamic
pm.max_children = 25
pm.start_servers = 6
pm.min_spare_servers = 3
pm.max_spare_servers = 12
pm.max_requests = 500
