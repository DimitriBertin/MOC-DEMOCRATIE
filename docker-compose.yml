version: "3.9"

services:
  db:
    image: mysql:8.0
    container_name: ${PROJECT_NAME}_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${WORDPRESS_DB_NAME}
      MYSQL_USER: ${WORDPRESS_DB_USER}
      MYSQL_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "${DB_PORT}:3306"

  wordpress:
    build:
      context: ./docker/wordpress
      dockerfile: Dockerfile
    image: ${PROJECT_NAME}_wp_image
    container_name: ${PROJECT_NAME}_wp
    depends_on:
      - db
    restart: unless-stopped
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      ADUI_DATA_MANIFEST: /var/www/html/wp-content/themes/atelierdesign/node_modules/@atelierdesignbe/core/src/data/manifest.json
    volumes:
      - wordpress_data:/var/www/html
      - ./wordpress/wp-content:/var/www/html/wp-content
      - ./php.ini:/usr/local/etc/php/conf.d/custom.ini
      - ./node_modules/@atelierdesignbe/core:/var/www/html/wp-content/themes/atelierdesign/node_modules/@atelierdesignbe/core:ro

  nginx:
    image: nginx:alpine
    container_name: ${PROJECT_NAME}_nginx
    depends_on:
      - wordpress
    restart: unless-stopped
    ports:
      - "${WP_PORT}:80"
    volumes:
      - wordpress_data:/var/www/html
      - ./wordpress/wp-content:/var/www/html/wp-content
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf

volumes:
  db_data:
  wordpress_data:
